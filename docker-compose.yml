services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234 
      POSTGRES_DB: coffee
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - teza_db:/var/lib/postgresql/data
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1884:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
volumes:
  teza_db:
  mosquitto_data:
